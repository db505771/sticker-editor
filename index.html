<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fatty Family Stickers</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
}

body {
    overflow-x: hidden;
    background: transparent !important;
}

#board {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: transparent !important;
    z-index: 1;
}

.placed-sticker {
    position: absolute;
    width: 100px;
    height: 100px;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    cursor: pointer;
    pointer-events: auto;
    z-index: 10;
}

#stickerTray {
    position: fixed;
    z-index: 9999;
    bottom: 12px;
    left: 12px;
    right: 12px;

    display: flex;
    align-items: center;
    gap: 14px;

    padding: 8px 2px;
    overflow-x: auto;
    overflow-y: hidden;

    background: transparent !important;
    border: none !important;
    box-shadow: none !important;

    scrollbar-width: none;
}

#stickerTray::-webkit-scrollbar {
    display: none;
}

.sticker-option {
    flex: 0 0 76px;
    width: 76px;
    min-height: 88px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;

    background: transparent !important;
    border: none;
    color: white;
    padding: 3px;
}

.sticker-option.selected {
    outline: 1px solid rgba(255,255,255,.85);
    outline-offset: 2px;
}

.sticker-option img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    pointer-events: none;
}

.sticker-name {
    max-width: 75px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sticker-quantity {
    font-size: 11px;
    color: rgba(255,255,255,.8);
}

#status {
    position: fixed;
    z-index: 10001;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 24px);
    padding: 8px 12px;

    background: transparent !important;
    color: white;

    font-size: 12px;
    text-align: center;
    text-shadow: 0 1px 4px black;

    display: none;
}

#emptyMessage {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: white;
}

</style>

</head>

<body>

<div id="board"></div>

<div id="status"></div>

<div id="stickerTray">
    <div id="emptyMessage">Loading stickers...</div>
</div>


<script>

/* =====================================
   CONFIGURATION
===================================== */

const API =
"https://script.google.com/macros/s/AKfycbwmhyUcGkUlcLSu9JJAph3V4eoACp1afq5KaTpcAWKAgK8BqrP1v_MNMySEGgkr0E2suQ/exec";

const board = document.getElementById("board");

const tray = document.getElementById("stickerTray");

const statusBox = document.getElementById("status");


/* =====================================
   STATE
===================================== */

let STICKER_LIBRARY = [];

let BOARD_STICKERS = [];

let INVENTORY = [];

let selectedStickerName = null;

let revision = 0;

let savedRevision = 0;

let isSaving = false;

let saveTimer = null;

let retryTimer = null;

let retryCount = 0;

let initialized = false;


/* =====================================
   STATUS
===================================== */

function showStatus(message) {

    statusBox.textContent = message;

    statusBox.style.display = "block";

}


function hideStatus() {

    statusBox.style.display = "none";

}


/* =====================================
   GET API - JSONP
===================================== */

function api(action, params = {}) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "sticker_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const query = new URLSearchParams({
            action,
            ...params,
            callback: callbackName
        });

        script.src = API + "?" + query.toString();

        const timeout = setTimeout(() => {

            cleanup();

            reject(new Error("Request timed out."));

        }, 25000);


        function cleanup() {

            clearTimeout(timeout);

            delete window[callbackName];

            script.remove();

        }


        window[callbackName] = data => {

            cleanup();

            if (!data || data.success === false) {

                reject(
                    new Error(data?.error || "Server error.")
                );

                return;

            }

            resolve(data);

        };


        script.onerror = () => {

            cleanup();

            reject(new Error("Connection failed."));

        };


        document.body.appendChild(script);

    });

}


/* =====================================
   POST SAVE
   Uses a hidden iframe because Apps
   Script POST responses are cross-origin.
===================================== */

function postBoard(payload) {

    return new Promise((resolve, reject) => {

        const frameName =
            "sticker_save_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000);

        const frame = document.createElement("iframe");

        frame.name = frameName;

        frame.style.position = "absolute";
        frame.style.width = "1px";
        frame.style.height = "1px";
        frame.style.opacity = "0";
        frame.style.pointerEvents = "none";

        document.body.appendChild(frame);


        const form = document.createElement("form");

        form.method = "POST";

        form.action = API;

        form.target = frameName;

        form.style.display = "none";


        const actionInput = document.createElement("input");

        actionInput.type = "hidden";
        actionInput.name = "action";
        actionInput.value = "saveBoard";


        const payloadInput = document.createElement("input");

        payloadInput.type = "hidden";
        payloadInput.name = "payload";
        payloadInput.value = JSON.stringify(payload);


        form.appendChild(actionInput);

        form.appendChild(payloadInput);

        document.body.appendChild(form);


        let finished = false;


        function cleanup() {

            if (finished) return;

            finished = true;

            frame.removeEventListener("load", onLoad);

            form.remove();

            frame.remove();

        }


        function onLoad() {

            cleanup();

            resolve();

        }


        frame.addEventListener("load", onLoad);


        const timeout = setTimeout(() => {

            cleanup();

            resolve();

        }, 20000);


        const originalCleanup = cleanup;

        cleanup = function() {

            clearTimeout(timeout);

            originalCleanup();

        };


        setTimeout(() => {

            try {

                form.submit();

            } catch (error) {

                cleanup();

                reject(error);

            }

        }, 100);

    });

}


/* =====================================
   LIBRARY
===================================== */

function findLibrary(name) {

    return STICKER_LIBRARY.find(item =>

        item.name.toLowerCase() ===
        name.toLowerCase()

    );

}


/* =====================================
   INITIAL LOAD
===================================== */

async function start() {

    try {

        showStatus("Loading stickers...");

        const result = await api("getInitialData");

        STICKER_LIBRARY = result.library || [];

        buildBoard(result.stickers || []);

        renderBoard();

        renderInventory();

        initialized = true;

        savedRevision = revision;

        showStatus("Stickers loaded!");

        setTimeout(() => {

            if (!isSaving && revision === savedRevision) {
                hideStatus();
            }

        }, 1500);

    } catch (error) {

        console.error(error);

        showStatus("Loading error: " + error.message);

        tray.innerHTML =
            '<div id="emptyMessage">Unable to load stickers.</div>';

    }

}


/* =====================================
   BUILD BOARD
===================================== */

function buildBoard(data) {

    INVENTORY = [];

    BOARD_STICKERS = [];

    data.forEach(item => {

        const librarySticker = findLibrary(item.name);

        if (!librarySticker) return;

        INVENTORY.push({

            name: item.name,

            quantity: Number(item.quantity) || 0

        });


        (item.placements || []).forEach(placement => {

            BOARD_STICKERS.push({

                name: item.name,

                imageUrl: librarySticker.imageUrl,

                index: Number(placement.index),

                x: Number(placement.x),

                y: Number(placement.y)

            });

        });

    });

}


/* =====================================
   RENDER BOARD
===================================== */

function renderBoard() {

    board.innerHTML = "";

    BOARD_STICKERS.forEach(item => {

        const img = document.createElement("img");

        img.src = item.imageUrl;

        img.className = "placed-sticker";

        img.alt = item.name;

        img.draggable = false;

        img.style.left = item.x + "px";

        img.style.top = item.y + "px";


        img.addEventListener("click", event => {

            event.stopPropagation();

            returnSticker(item);

        });


        board.appendChild(img);

    });

}


/* =====================================
   RENDER INVENTORY
===================================== */

function renderInventory() {

    tray.innerHTML = "";

    const available = INVENTORY.filter(item =>

        item.quantity > 0

    );


    if (!available.length) {

        tray.innerHTML =
            '<div id="emptyMessage">No stickers available.</div>';

        return;

    }


    available.forEach(item => {

        const sticker = findLibrary(item.name);

        if (!sticker) return;


        const button = document.createElement("button");

        button.type = "button";

        button.className = "sticker-option";


        if (selectedStickerName === item.name) {

            button.classList.add("selected");

        }


        const img = document.createElement("img");

        img.src = sticker.imageUrl;


        const name = document.createElement("div");

        name.className = "sticker-name";

        name.textContent = item.name;


        const quantity = document.createElement("div");

        quantity.className = "sticker-quantity";

        quantity.textContent = item.quantity + "x";


        button.append(img, name, quantity);


        button.addEventListener("click", () => {

            selectedStickerName = item.name;

            renderInventory();

            showStatus(
                "Tap your profile to place " +
                item.name +
                "."
            );

        });


        tray.appendChild(button);

    });

}


/* =====================================
   CREATE SAVE SNAPSHOT
===================================== */

function createSnapshot() {

    return {

        stickers: INVENTORY.map(item => {

            return {

                name: item.name,

                quantity: item.quantity,

                placements: BOARD_STICKERS

                    .filter(sticker =>
                        sticker.name === item.name
                    )

                    .map(sticker => ({

                        x: sticker.x,

                        y: sticker.y

                    }))

            };

        })

    };

}


/* =====================================
   VERIFY SAVED BOARD
===================================== */

function boardsMatch(expected, actual) {

    if (!actual || !Array.isArray(actual.stickers)) {
        return false;
    }

    for (const item of expected.stickers) {

        const saved = actual.stickers.find(sticker =>

            sticker.name.toLowerCase() ===
            item.name.toLowerCase()

        );

        if (!saved) return false;

        if (
            Number(saved.quantity) !==
            Number(item.quantity)
        ) {
            return false;
        }

        const expectedPositions = item.placements || [];

        const savedPositions = saved.placements || [];

        if (
            expectedPositions.length !==
            savedPositions.length
        ) {
            return false;
        }

        for (
            let i = 0;
            i < expectedPositions.length;
            i++
        ) {

            if (
                Number(expectedPositions[i].x) !==
                Number(savedPositions[i].x) ||

                Number(expectedPositions[i].y) !==
                Number(savedPositions[i].y)
            ) {

                return false;

            }

        }

    }

    return true;

}


/* =====================================
   UPDATE LOCAL INDEXES
===================================== */

function updateIndexes() {

    INVENTORY.forEach(item => {

        const matching = BOARD_STICKERS.filter(sticker =>

            sticker.name === item.name

        );

        matching.forEach((sticker, index) => {

            sticker.index = index + 1;

        });

    });

}


/* =====================================
   SCHEDULE AUTOSAVE
===================================== */

function scheduleSave() {

    if (!initialized) return;

    revision++;

    clearTimeout(saveTimer);

    clearTimeout(retryTimer);

    retryCount = 0;

    showStatus("Unsaved changes...");

    saveTimer = setTimeout(() => {

        flushSave();

    }, 500);

}


/* =====================================
   SAVE ENGINE
===================================== */

async function flushSave() {

    if (!initialized) return;

    if (isSaving) return;

    if (revision === savedRevision) return;


    isSaving = true;

    const savingRevision = revision;

    const snapshot = createSnapshot();


    showStatus("Saving stickers...");


    try {

        // Send the entire current board.
        // If the iframe request times out, verification
        // below still determines whether it saved.

        await postBoard(snapshot);


        // Independently read the board back from Sheets.

        const verification = await api("getBoard");


        if (!boardsMatch(snapshot, verification)) {

            throw new Error(
                "Google Sheets did not confirm the changes."
            );

        }


        savedRevision = savingRevision;

        retryCount = 0;


        // Only update local indexes if no newer changes
        // were made while this save was running.

        if (revision === savingRevision) {

            updateIndexes();

            showStatus("Saved!");

            setTimeout(() => {

                if (
                    !isSaving &&
                    revision === savedRevision
                ) {

                    hideStatus();

                }

            }, 1800);

        }

    } catch (error) {

        console.error("Sticker save failed:", error);

        retryCount++;

        showStatus(
            "Save failed. Retrying..."
        );

    } finally {

        isSaving = false;

    }


    // If something changed while saving, immediately
    // save the newer board.

    if (revision !== savedRevision) {

        if (retryCount > 0) {

            const delay = Math.min(
                30000,
                1500 * Math.pow(2, Math.min(retryCount - 1, 5))
            );

            clearTimeout(retryTimer);

            retryTimer = setTimeout(() => {

                flushSave();

            }, delay);

        } else {

            flushSave();

        }

    }

}


/* =====================================
   PLACE STICKER
===================================== */

board.addEventListener("click", event => {

    if (!selectedStickerName) return;

    const rect = board.getBoundingClientRect();

    const x = Math.max(
        0,
        Math.round(event.clientX - rect.left - 50)
    );

    const y = Math.max(
        0,
        Math.round(event.clientY - rect.top - 50)
    );

    placeSticker(selectedStickerName, x, y);

});


function placeSticker(name, x, y) {

    const inventoryItem = INVENTORY.find(item =>

        item.name === name

    );

    const librarySticker = findLibrary(name);


    if (
        !inventoryItem ||
        inventoryItem.quantity < 1
    ) {

        selectedStickerName = null;

        renderInventory();

        return;

    }


    if (!librarySticker) {

        showStatus("Sticker image unavailable.");

        return;

    }


    // Update instantly.

    inventoryItem.quantity--;


    BOARD_STICKERS.push({

        name: name,

        imageUrl: librarySticker.imageUrl,

        index: null,

        x: x,

        y: y

    });


    selectedStickerName = null;


    renderBoard();

    renderInventory();


    // Save automatically.

    scheduleSave();

}


/* =====================================
   REMOVE STICKER
===================================== */

function returnSticker(item) {

    const inventoryItem = INVENTORY.find(entry =>

        entry.name === item.name

    );

    if (!inventoryItem) return;


    // Update instantly.

    BOARD_STICKERS = BOARD_STICKERS.filter(sticker =>

        sticker !== item

    );


    inventoryItem.quantity++;


    renderBoard();

    renderInventory();


    // Save automatically.

    scheduleSave();

}


/* =====================================
   RETRY WHEN CONNECTION RETURNS
===================================== */

window.addEventListener("online", () => {

    if (revision !== savedRevision) {

        showStatus("Connection restored. Saving...");

        clearTimeout(retryTimer);

        retryTimer = setTimeout(() => {

            flushSave();

        }, 300);

    }

});


/* =====================================
   INITIALIZE
===================================== */

start();

</script>

</body>
</html>
